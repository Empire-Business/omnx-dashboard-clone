<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Ícone declarado já no HTML: sem isto o navegador pede /favicon.ico antes de
         o JS rodar e, com o fallback de SPA da Vercel, recebe o próprio index.html
         (text/html) — resultando em ícone quebrado/genérico na aba. -->
    <link rel="icon" type="image/png" href="/favicon-omnx.png" />
    <link rel="apple-touch-icon" href="/favicon-omnx.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OMNX</title>
    <!-- Tipografia da marca: graphikMedium/graphikRegular (ver docs/DESIGN-SYSTEM-NUBANK.md).
         Sem asset proprietário embutido — o navegador recorre ao fallback Arial/sans-serif
         declarado em tailwind.config.js e src/index.css sem travar o carregamento. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
