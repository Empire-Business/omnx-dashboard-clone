name: Integration — Multi-tenant Isolation

# Fase 0.5 do plano multi-tenant: roda a suite de isolamento cross-tenant
# (RLS) a cada push/PR, contra o projeto Supabase de TESTE.
#
# Pre-requisitos (uma vez):
#   1. Projeto Supabase de TESTE com o schema aplicado (baseline de producao) e
#      o seed de privilegios __tests__/fixtures/test-db-grants.sql.
#   2. Secrets do repositorio (Settings > Secrets and variables > Actions):
#        TEST_SUPABASE_URL             = https://<ref-do-teste>.supabase.co
#        TEST_SUPABASE_ANON_KEY        = anon public do projeto de TESTE
#        TEST_SUPABASE_SERVICE_ROLE_KEY = service_role do projeto de TESTE
#        TEST_PROJECT_REF              = ref do projeto de TESTE (20 chars)
#      NUNCA aponte estes secrets para producao. A guarda
#      __tests__/helpers/safe-guard.ts aborta se a URL for de producao ou se o
#      ref nao bater com TEST_PROJECT_REF.

# Modo "só produção" (2026-07-18): o banco de TESTE foi deletado, então a suite de
# isolamento não tem alvo. Os gatilhos automáticos (push/PR) foram desativados para
# não deixar a CI vermelha. Só roda sob demanda (workflow_dispatch) e, mesmo assim,
# PULA graciosamente se os secrets TEST_* não existirem (ver step "Check").
# Para reativar de vez: recrie um projeto Supabase de teste, recadastre os secrets
# TEST_* e restaure os blocos push/pull_request abaixo.
on:
  workflow_dispatch: {}

# O projeto de teste e compartilhado: serializa todos os runs (um por vez).
concurrency:
  group: isolation-suite
  cancel-in-progress: false

jobs:
  isolation:
    name: RLS cross-tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail-soft (modo "só produção", 2026-07-18): sem projeto Supabase de TESTE,
      # a suite de isolamento não tem onde rodar. Se o secret TEST_SUPABASE_URL não
      # estiver configurado, o job PULA graciosamente (verde) em vez de falhar.
      # Para reativar: recrie um projeto de teste e recadastre os secrets TEST_*.
      - name: Check test Supabase configured
        id: check
        run: |
          if [ -z "${{ secrets.TEST_SUPABASE_URL }}" ]; then
            echo "⏭️  Sem TEST_SUPABASE_URL (modo só produção) — pulando a suite de isolamento."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm ci

      - name: Install eb-dash2 dependencies (vitest)
        if: steps.check.outputs.skip == 'false'
        run: npm ci
        working-directory: eb-dash2

      - name: Run isolation suite
        if: steps.check.outputs.skip == 'false'
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_PROJECT_REF: ${{ secrets.TEST_PROJECT_REF }}
        run: ./eb-dash2/node_modules/.bin/vitest -c eb-dash2/vitest.integration.config.ts run
